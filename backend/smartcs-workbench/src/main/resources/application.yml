server:
  port: 8083
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: smartcs-workbench
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SMARTCS_DB_URL:jdbc:mysql://localhost:3306/smartcs_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SMARTCS_DB_USERNAME:root}
    password: ${SMARTCS_DB_PASSWORD:root}
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false
    sentinel:
      enabled: false

smartcs:
  realtime:
    ticket-events:
      # 坐席工单 SSE 默认关闭；开启后从共享 MySQL 增量扫描，不依赖 Redis 或 MQ。
      enabled: ${SMARTCS_WORKBENCH_TICKET_SSE_ENABLED:false}
      poll-interval-ms: ${SMARTCS_WORKBENCH_TICKET_SSE_POLL_INTERVAL_MS:2000}
      batch-size: ${SMARTCS_WORKBENCH_TICKET_SSE_BATCH_SIZE:100}
      heartbeat-interval-ms: ${SMARTCS_WORKBENCH_TICKET_SSE_HEARTBEAT_INTERVAL_MS:15000}
      emitter-timeout-ms: ${SMARTCS_WORKBENCH_TICKET_SSE_EMITTER_TIMEOUT_MS:1800000}
  auth:
    strict-enabled: ${SMARTCS_AUTH_STRICT_ENABLED:false}
    jwt:
      enabled: ${SMARTCS_AUTH_JWT_ENABLED:false}
      secret: ${SMARTCS_AUTH_JWT_SECRET:}
      issuer: ${SMARTCS_AUTH_JWT_ISSUER:}
      audience: ${SMARTCS_AUTH_JWT_AUDIENCE:}
  notification:
    enabled: ${SMARTCS_NOTIFICATION_ENABLED:true}
    base-url: ${SMARTCS_NOTIFICATION_BASE_URL:http://localhost:8085}
    # 默认保持 Workbench 事务内写用户消息；关闭时必须启用 outbox 和 Notification USER_SESSION 通道。
    user-message-direct-write-enabled: ${SMARTCS_NOTIFICATION_USER_MESSAGE_DIRECT_WRITE_ENABLED:true}
    outbox:
      # 默认保持原有同步 HTTP 辅助链路；应用 12 号 SQL 后再显式开启。
      enabled: ${SMARTCS_NOTIFICATION_OUTBOX_ENABLED:false}
      fixed-delay-ms: ${SMARTCS_NOTIFICATION_OUTBOX_FIXED_DELAY_MS:30000}
      batch-size: ${SMARTCS_NOTIFICATION_OUTBOX_BATCH_SIZE:20}
      max-attempts: ${SMARTCS_NOTIFICATION_OUTBOX_MAX_ATTEMPTS:5}
      lease-duration-ms: ${SMARTCS_NOTIFICATION_OUTBOX_LEASE_DURATION_MS:120000}
      worker-id: ${SMARTCS_NOTIFICATION_OUTBOX_WORKER_ID:}
