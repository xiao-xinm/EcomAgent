server:
  port: 8080

spring:
  application:
    name: smartcs-gateway
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false
    sentinel:
      enabled: false

smartcs:
  agent-core:
    base-url: ${SMARTCS_AGENT_CORE_BASE_URL:http://localhost:8081}
  auth:
    strict-enabled: ${SMARTCS_AUTH_STRICT_ENABLED:false}
    jwt:
      enabled: ${SMARTCS_AUTH_JWT_ENABLED:false}
      secret: ${SMARTCS_AUTH_JWT_SECRET:}
      issuer: ${SMARTCS_AUTH_JWT_ISSUER:}
      audience: ${SMARTCS_AUTH_JWT_AUDIENCE:}
  cors:
    allowed-origins: ${SMARTCS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
