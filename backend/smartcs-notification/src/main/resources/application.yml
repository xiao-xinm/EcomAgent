server:
  port: 8085
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: smartcs-notification
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SMARTCS_DB_URL:jdbc:mysql://localhost:3306/smartcs_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SMARTCS_DB_USERNAME:root}
    password: ${SMARTCS_DB_PASSWORD:root}
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false
    sentinel:
      enabled: false

smartcs:
  notification:
    retry:
      # 当前没有内置真实投递通道，接入并验证通道幂等后才能开启。
      enabled: ${SMARTCS_NOTIFICATION_RETRY_ENABLED:false}
      fixed-delay-ms: ${SMARTCS_NOTIFICATION_RETRY_FIXED_DELAY_MS:30000}
      batch-size: ${SMARTCS_NOTIFICATION_RETRY_BATCH_SIZE:20}
      max-attempts: ${SMARTCS_NOTIFICATION_RETRY_MAX_ATTEMPTS:5}
