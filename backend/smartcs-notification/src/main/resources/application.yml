server:
  port: 8085
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: smartcs-notification
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SMARTCS_DB_URL:jdbc:mysql://localhost:3306/smartcs_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SMARTCS_DB_USERNAME:root}
    password: ${SMARTCS_DB_PASSWORD:root}
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false
    sentinel:
      enabled: false

smartcs:
  notification:
    channel:
      user-session:
        # 开启前必须同时开启 retry worker；历史和 DIRECT 事件只确认交付，不重复写消息。
        enabled: ${SMARTCS_NOTIFICATION_USER_SESSION_CHANNEL_ENABLED:false}
    retry:
      # 默认关闭；开启 USER_SESSION 通道时必须一并开启。
      enabled: ${SMARTCS_NOTIFICATION_RETRY_ENABLED:false}
      fixed-delay-ms: ${SMARTCS_NOTIFICATION_RETRY_FIXED_DELAY_MS:30000}
      batch-size: ${SMARTCS_NOTIFICATION_RETRY_BATCH_SIZE:20}
      max-attempts: ${SMARTCS_NOTIFICATION_RETRY_MAX_ATTEMPTS:5}
      # 多实例通过 MySQL 租约避免重复领取；租约应长于单次通道调用超时。
      lease-duration-ms: ${SMARTCS_NOTIFICATION_RETRY_LEASE_DURATION_MS:120000}
      worker-id: ${SMARTCS_NOTIFICATION_RETRY_WORKER_ID:}
